plugins {
    id 'com.android.application'
}

android {
    namespace 'org.a2ui.android.v0_9_1.sample'
    compileSdk 35

    defaultConfig {
        applicationId 'org.a2ui.android.v0_9_1.sample'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '0.9.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation project(':a2ui')
}
